name: Build Sword Reach Indicator

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Unpack project
        run: |
          mkdir project
          unzip -q sword-reach-indicator-project.zip -d project
          F=$(find project \( -name build.gradle -o -name build.gradle.kts \) | head -n1)
          echo "PROJECT_DIR=$(dirname "$F")" >> $GITHUB_ENV

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew build --no-daemon; else gradle build --no-daemon; fi

      - uses: actions/upload-artifact@v4
        with:
          name: SwordReachIndicator-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
